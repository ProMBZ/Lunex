name: Portable Lunex handoff CI
on:
  push:
    branches: [main, portable-website-handoff]
    paths:
      - "integration/portable-website/**"
      - ".github/workflows/portable-website.yml"
  pull_request:
    branches: [main]
    paths:
      - "integration/portable-website/**"
      - ".github/workflows/portable-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Typecheck and build portable app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integration/portable-website
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install portable dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Create portable package archive
        run: zip -r /tmp/lunex-portable-website.zip . -x "node_modules/*" ".next/*" "package-lock.json"
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: lunex-portable-website
          path: /tmp/lunex-portable-website.zip
          if-no-files-found: error
          retention-days: 90
